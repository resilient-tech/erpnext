{% extends "templates/web.html" %}

{% block title %}
{{ _("Verify Email") }}
{% endblock%}

{% block page_content %}
    {%- set alert_class = 'alert-success' if success else 'alert-danger' -%}
    <div class="alert {{ alert_class }}">
        {% if success %}
                {{ success }}
        {% else %}
                {{ error }}
        {% endif %}
    </div>
{% endblock%}
